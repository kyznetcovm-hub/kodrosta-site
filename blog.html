<style>
  .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px; margin-top: 32px; }
  .post-card { display: flex; flex-direction: column; border: 1px solid var(--gray-100); border-radius: var(--radius); overflow: hidden; background: var(--white); text-decoration: none; transition: border-color .15s, box-shadow .15s; }
  .post-card:hover { border-color: var(--blue); box-shadow: 0 10px 30px -18px rgba(11,11,12,.25); }
  .post-card-cover { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--gray-50); }
  .post-card-body { padding: 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .post-card .tag { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--blue); font-weight: 600; }
  .post-card h3 { font-size: 18px; color: var(--black); margin: 0; }
  .post-card p { color: var(--gray-700); font-size: 14.5px; line-height: 1.5; margin: 0; }
  .post-card .post-date { color: var(--gray-500); font-size: 13px; margin-top: auto; padding-top: 8px; }
  .blog-empty { color: var(--gray-500); padding: 32px 0; }

<script type="module">
  import { POSTS } from "./posts-data.js";

  var MONTHS_FULL = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  function fmtDate(iso) {
    var d = new Date(iso);
    return d.getDate() + " " + MONTHS_FULL[d.getMonth()] + " " + d.getFullYear();
  }

  var grid = document.querySelector(".js-post-grid");
  if (POSTS.length === 0) {
    grid.outerHTML = '<p class="blog-empty">Первый отчёт скоро появится — следите за <a href="https://t.me/codrosta" target="_blank" rel="noopener" style="color:var(--blue)">Telegram-каналом</a>.</p>';
  } else {
    grid.innerHTML = POSTS.map(function (p) {
      return (
        '<a class="post-card" href="blog/' + p.slug + '.html">' +
          '<img class="post-card-cover" src="' + p.cover + '" alt="" loading="lazy">' +
          '<div class="post-card-body">' +
            '<span class="tag">' + p.tag + '</span>' +
            '<h3>' + p.title + '</h3>' +
            '<p>' + p.excerpt + '</p>' +
            '<span class="post-date">' + fmtDate(p.date) + '</span>' +
          '</div>' +
        '</a>'
      );
    }).join("");
  }

  document.getElementById("js-year").textContent = new Date().getFullYear();
</script>
